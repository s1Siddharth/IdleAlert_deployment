services:
  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      ENVIRONMENT: production
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/smart_classroom.db}
    volumes:
      - idlealert-data:/data
      - idlealert-uploads:/app/uploads
      - ./backend/models:/app/models:ro
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  idlealert-data:
  idlealert-uploads:
